<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🎀 יום הולדת - ניהול משימות</title>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --rose:    #e8416e;
      --rose-lt: #fde8ef;
      --rose-dk: #c0284f;
      --gold:    #f4b942;
      --gold-lt: #fef6e4;
      --sky:     #3ba5d6;
      --sky-lt:  #e3f4fd;
      --mint:    #34c48a;
      --mint-lt: #e3f9f0;
      --ink:     #1a1a2e;
      --ink-md:  #4a4a6a;
      --ink-lt:  #8888aa;
      --bg:      #f8f5f9;
      --card:    #ffffff;
      --border:  #ede8f2;
      --radius:  16px;
      --shadow:  0 4px 24px rgba(100,60,120,.08);
      --shadow-hover: 0 8px 36px rgba(100,60,120,.14);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Heebo', sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      direction: rtl;
    }

    /* ── HEADER ────────────────────────────── */
    header {
      background: linear-gradient(135deg, #e8416e 0%, #f4b942 60%, #f87a91 100%);
      padding: 36px 24px 48px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    header::before {
      content: '';
      position: absolute; inset: 0;
      background: radial-gradient(ellipse at 80% 20%, rgba(255,255,255,.18) 0%, transparent 60%),
                  radial-gradient(ellipse at 20% 80%, rgba(255,255,255,.12) 0%, transparent 50%);
    }
    header .confetti { font-size: 2rem; position: relative; display: block; margin-bottom: 8px; letter-spacing: .2em; }
    header h1 { position: relative; font-size: 2.4rem; font-weight: 800; color: #fff; text-shadow: 0 2px 12px rgba(0,0,0,.15); }
    header p  { position: relative; color: rgba(255,255,255,.9); font-size: 1rem; margin-top: 6px; font-weight: 400; }

    /* ── LAYOUT ────────────────────────────── */
    .main-wrap {
      max-width: 960px;
      margin: -24px auto 0;
      padding: 0 16px 60px;
    }

    /* ── FORM CARD ─────────────────────────── */
    .form-card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 28px 28px 24px;
      margin-bottom: 28px;
    }
    .form-card h2 {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--ink);
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group.full { grid-column: 1 / -1; }
    label { font-size: .82rem; font-weight: 600; color: var(--ink-md); }
    input, select, textarea {
      font-family: 'Heebo', sans-serif;
      font-size: .95rem;
      padding: 10px 14px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      background: var(--bg);
      color: var(--ink);
      outline: none;
      transition: border-color .2s, box-shadow .2s;
      direction: rtl;
    }
    input:focus, select:focus, textarea:focus {
      border-color: var(--rose);
      box-shadow: 0 0 0 3px rgba(232,65,110,.1);
      background: #fff;
    }
    textarea { resize: vertical; min-height: 72px; }

    .btn-add {
      grid-column: 1 / -1;
      background: linear-gradient(135deg, var(--rose), var(--rose-dk));
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 13px 24px;
      font-family: 'Heebo', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform .15s, box-shadow .15s, opacity .15s;
      box-shadow: 0 4px 16px rgba(232,65,110,.3);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-add:hover { transform: translateY(-2px); box-shadow: 0 6px 22px rgba(232,65,110,.38); }
    .btn-add:active { transform: translateY(0); opacity: .9; }

    /* ── FILTER BAR ────────────────────────── */
    .filter-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
      align-items: center;
    }
    .filter-bar span { font-size: .85rem; font-weight: 600; color: var(--ink-lt); }
    .pill {
      border: none;
      border-radius: 50px;
      padding: 7px 18px;
      font-family: 'Heebo', sans-serif;
      font-size: .85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all .2s;
      background: var(--card);
      color: var(--ink-md);
      box-shadow: 0 2px 8px rgba(0,0,0,.06);
    }
    .pill:hover { background: var(--rose-lt); color: var(--rose); }
    .pill.active { background: var(--rose); color: #fff; box-shadow: 0 3px 12px rgba(232,65,110,.3); }

    /* ── STATS ─────────────────────────────── */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 28px;
    }
    .stat-card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 18px 20px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .stat-card .stat-icon { font-size: 1.5rem; }
    .stat-card .stat-num  { font-size: 1.8rem; font-weight: 800; line-height: 1; }
    .stat-card .stat-lbl  { font-size: .78rem; color: var(--ink-lt); font-weight: 500; }
    .stat-card.rose  { border-top: 3px solid var(--rose); }
    .stat-card.gold  { border-top: 3px solid var(--gold); }
    .stat-card.mint  { border-top: 3px solid var(--mint); }
    .stat-card.rose  .stat-num { color: var(--rose); }
    .stat-card.gold  .stat-num { color: var(--gold); }
    .stat-card.mint  .stat-num { color: var(--mint); }
    .stat-card.sky   { border-top: 3px solid var(--sky); }
    .stat-card.sky   .stat-num { color: var(--sky); font-size: 1.4rem; }

    /* ── OWNER SECTIONS ────────────────────── */
    .owner-section { margin-bottom: 32px; }
    .owner-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }
    .owner-avatar {
      width: 40px; height: 40px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.2rem;
      font-weight: 800;
      flex-shrink: 0;
    }
    .owner-avatar.parent1 { background: var(--rose-lt); color: var(--rose); }
    .owner-avatar.parent2 { background: var(--sky-lt);  color: var(--sky);  }
    .owner-avatar.shared  { background: var(--gold-lt); color: var(--gold); }
    .owner-name { font-size: 1.1rem; font-weight: 700; }
    .owner-count {
      margin-right: auto;
      font-size: .8rem;
      font-weight: 600;
      color: var(--ink-lt);
      background: var(--bg);
      padding: 3px 10px;
      border-radius: 50px;
    }

    /* ── TASK CARD ─────────────────────────── */
    .task-card {
      background: var(--card);
      border-radius: 12px;
      box-shadow: var(--shadow);
      padding: 16px 18px;
      margin-bottom: 10px;
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 14px;
      align-items: start;
      transition: box-shadow .2s, transform .2s;
      animation: slideIn .28s ease;
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .task-card:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
    .task-card.done { opacity: .55; }
    .task-card.done .task-title { text-decoration: line-through; color: var(--ink-lt); }

    .task-check {
      width: 22px; height: 22px;
      border: 2px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      margin-top: 2px;
      transition: all .2s;
      background: #fff;
    }
    .task-check.checked {
      background: var(--mint);
      border-color: var(--mint);
      color: #fff;
    }
    .task-check:hover { border-color: var(--mint); }

    .task-body { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
    .task-title { font-size: .97rem; font-weight: 600; color: var(--ink); line-height: 1.4; }
    .task-meta  { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .tag {
      font-size: .72rem;
      font-weight: 600;
      padding: 2px 9px;
      border-radius: 50px;
    }
    .tag.owner-tag { background: var(--rose-lt); color: var(--rose-dk); }
    .tag.owner-tag.sky { background: var(--sky-lt); color: var(--sky); }
    .task-notes { font-size: .82rem; color: var(--ink-lt); margin-top: 2px; }
    .task-date  { font-size: .74rem; color: var(--ink-lt); }

    .btn-delete {
      background: none;
      border: none;
      color: var(--ink-lt);
      cursor: pointer;
      font-size: 1rem;
      padding: 4px;
      border-radius: 6px;
      transition: color .2s, background .2s;
      flex-shrink: 0;
      line-height: 1;
    }
    .btn-delete:hover { color: var(--rose); background: var(--rose-lt); }

    /* ── EMPTY STATE ───────────────────────── */
    .empty {
      text-align: center;
      padding: 40px 20px;
      color: var(--ink-lt);
    }
    .empty .empty-icon { font-size: 3rem; display: block; margin-bottom: 10px; }
    .empty p { font-size: .9rem; }

    /* ── TOAST ─────────────────────────────── */
    .toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--ink);
      color: #fff;
      padding: 12px 24px;
      border-radius: 50px;
      font-size: .9rem;
      font-weight: 600;
      box-shadow: 0 6px 30px rgba(0,0,0,.25);
      z-index: 999;
      transition: transform .3s cubic-bezier(.34,1.56,.64,1);
      pointer-events: none;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }

    /* ── RESPONSIVE ────────────────────────── */
    .stats-row { grid-template-columns: repeat(4, 1fr); }

    @media (max-width: 600px) {
      header h1 { font-size: 1.8rem; }
      .form-grid { grid-template-columns: 1fr; }
      .form-group.full { grid-column: auto; }
      .stats-row { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>

<header>
  <span class="confetti">🎈 🎀 🎂 🎁 🎉</span>
  <h1>יום הולדת של הנסיכה</h1>
  <p>ניהול משימות משותף לשני ההורים</p>
</header>

<div class="main-wrap">

  <!-- STATS -->
  <div class="stats-row" id="statsRow">
    <div class="stat-card rose">
      <span class="stat-icon">📋</span>
      <span class="stat-num" id="statTotal">0</span>
      <span class="stat-lbl">סה"כ משימות</span>
    </div>
    <div class="stat-card gold">
      <span class="stat-icon">⏳</span>
      <span class="stat-num" id="statPending">0</span>
      <span class="stat-lbl">בהמתנה</span>
    </div>
    <div class="stat-card mint">
      <span class="stat-icon">✅</span>
      <span class="stat-num" id="statDone">0</span>
      <span class="stat-lbl">הושלמו</span>
    </div>
    <div class="stat-card sky">
      <span class="stat-icon">💰</span>
      <span class="stat-num" id="statCost">₪0</span>
      <span class="stat-lbl">עלות משוערת</span>
    </div>
  </div>

  <!-- ADD TASK FORM -->
  <div class="form-card">
    <h2>➕ הוסף משימה חדשה</h2>
    <div class="form-grid">
      <div class="form-group full">
        <label for="taskTitle">שם המשימה *</label>
        <input type="text" id="taskTitle" placeholder="לדוגמה: להזמין עוגה..." />
      </div>
      <div class="form-group">
        <label for="taskOwner">אחראי *</label>
        <select id="taskOwner">
          <option value="">-- בחר אחראי --</option>
          <option value="parent1">👩 אמא</option>
          <option value="parent2">👨 אבא</option>
          <option value="shared">👫 שניהם</option>
        </select>
      </div>
      <div class="form-group">
        <label for="taskPriority">עדיפות</label>
        <select id="taskPriority">
          <option value="normal">רגילה</option>
          <option value="high">⚡ גבוהה</option>
          <option value="low">💤 נמוכה</option>
        </select>
      </div>
      <div class="form-group">
        <label for="taskDeadline">דד ליין</label>
        <input type="date" id="taskDeadline" />
      </div>
      <div class="form-group">
        <label for="taskCost">עלות משוערת (₪)</label>
        <input type="number" id="taskCost" placeholder="0" min="0" step="1" />
      </div>
      <div class="form-group full">
        <label for="taskNotes">הערות</label>
        <textarea id="taskNotes" placeholder="פרטים נוספים, קישורים, תזכורות..."></textarea>
      </div>
      <button class="btn-add" onclick="addTask()">
        <span>הוסף משימה</span> <span>🎀</span>
      </button>
    </div>
  </div>

  <!-- FILTER BAR -->
  <div class="filter-bar">
    <span>סינון:</span>
    <button class="pill active" onclick="setFilter('all', this)">הכל</button>
    <button class="pill" onclick="setFilter('pending', this)">⏳ פתוחות</button>
    <button class="pill" onclick="setFilter('done', this)">✅ הושלמו</button>
    <button class="pill" onclick="setFilter('high', this)">⚡ דחופות</button>
  </div>

  <!-- TASK LISTS -->
  <div id="taskContainer"></div>

</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
  const OWNERS = {
    parent1: { label: 'אמא', emoji: '👩', cls: 'parent1' },
    parent2: { label: 'אבא', emoji: '👨', cls: 'parent2' },
    shared:  { label: 'שניהם', emoji: '👫', cls: 'shared' },
  };
  const PRIORITY = { high: '⚡ גבוהה', normal: 'רגילה', low: '💤 נמוכה' };

  let tasks = JSON.parse(localStorage.getItem('bdayTasks') || '[]');
  let currentFilter = 'all';

  function save() {
    localStorage.setItem('bdayTasks', JSON.stringify(tasks));
  }

  function addTask() {
    const title    = document.getElementById('taskTitle').value.trim();
    const owner    = document.getElementById('taskOwner').value;
    const notes    = document.getElementById('taskNotes').value.trim();
    const priority = document.getElementById('taskPriority').value;
    const deadline = document.getElementById('taskDeadline').value;
    const cost     = parseFloat(document.getElementById('taskCost').value) || 0;

    if (!title) return toast('🌸 שכחת למלא שם משימה!');
    if (!owner) return toast('👤 בחר מי אחראי על המשימה');

    tasks.push({
      id: Date.now(),
      title, owner, notes, priority, deadline, cost,
      done: false,
      created: new Date().toLocaleDateString('he-IL')
    });
    save();

    document.getElementById('taskTitle').value    = '';
    document.getElementById('taskOwner').value    = '';
    document.getElementById('taskNotes').value    = '';
    document.getElementById('taskPriority').value = 'normal';
    document.getElementById('taskDeadline').value = '';
    document.getElementById('taskCost').value     = '';

    render();
    toast('✨ משימה נוספה בהצלחה!');
  }

  function toggleDone(id) {
    const t = tasks.find(t => t.id === id);
    if (t) { t.done = !t.done; save(); render(); }
  }

  function deleteTask(id) {
    tasks = tasks.filter(t => t.id !== id);
    save(); render();
    toast('🗑️ המשימה נמחקה');
  }

  function setFilter(f, btn) {
    currentFilter = f;
    document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    render();
  }

  function filtered() {
    if (currentFilter === 'pending') return tasks.filter(t => !t.done);
    if (currentFilter === 'done')    return tasks.filter(t => t.done);
    if (currentFilter === 'high')    return tasks.filter(t => t.priority === 'high');
    return tasks;
  }

  function render() {
    const list = filtered();
    const container = document.getElementById('taskContainer');

    // stats
    document.getElementById('statTotal').textContent   = tasks.length;
    document.getElementById('statPending').textContent = tasks.filter(t => !t.done).length;
    document.getElementById('statDone').textContent    = tasks.filter(t => t.done).length;
    const totalCost = tasks.reduce((s, t) => s + (t.cost || 0), 0);
    document.getElementById('statCost').textContent    = '₪' + totalCost.toLocaleString('he-IL');

    // group by owner
    const groups = {};
    list.forEach(t => {
      if (!groups[t.owner]) groups[t.owner] = [];
      groups[t.owner].push(t);
    });

    if (Object.keys(groups).length === 0) {
      container.innerHTML = `<div class="empty"><span class="empty-icon">🎈</span><p>${
        currentFilter === 'all'
          ? 'עדיין אין משימות. הוסיפו את הראשונה!'
          : 'אין משימות תואמות לסינון הנוכחי.'
      }</p></div>`;
      return;
    }

    const order = ['parent1', 'parent2', 'shared'];
    const sorted = order.filter(o => groups[o]);

    container.innerHTML = sorted.map(ownerKey => {
      const o = OWNERS[ownerKey];
      const ownerTasks = groups[ownerKey];
      return `
        <div class="owner-section">
          <div class="owner-header">
            <div class="owner-avatar ${o.cls}">${o.emoji}</div>
            <span class="owner-name">${o.label}</span>
            <span class="owner-count">${ownerTasks.length} משימות</span>
          </div>
          ${ownerTasks.map(t => taskHTML(t)).join('')}
        </div>`;
    }).join('');
  }

  function taskHTML(t) {
    const o = OWNERS[t.owner];
    const priorityBadge = t.priority === 'high'
      ? `<span class="tag" style="background:#fff3e0;color:#e65100">⚡ דחוף</span>` : '';
    const deadlineBadge = t.deadline
      ? (() => {
          const d   = new Date(t.deadline);
          const now = new Date();
          now.setHours(0,0,0,0);
          const diff = Math.ceil((d - now) / 86400000);
          const label = d.toLocaleDateString('he-IL');
          const color = diff < 0 ? '#c62828' : diff <= 3 ? '#e65100' : '#1565c0';
          const bg    = diff < 0 ? '#ffebee' : diff <= 3 ? '#fff3e0' : '#e3f2fd';
          const icon  = diff < 0 ? '⚠️' : '📅';
          return `<span class="tag" style="background:${bg};color:${color}">${icon} ${label}</span>`;
        })()
      : '';
    const costBadge = t.cost
      ? `<span class="tag" style="background:#e8f5e9;color:#2e7d32">💰 ₪${t.cost.toLocaleString('he-IL')}</span>`
      : '';
    return `
      <div class="task-card ${t.done ? 'done' : ''}">
        <div class="task-check ${t.done ? 'checked' : ''}" onclick="toggleDone(${t.id})">
          ${t.done ? '✓' : ''}
        </div>
        <div class="task-body">
          <div class="task-title">${escHtml(t.title)}</div>
          <div class="task-meta">
            ${priorityBadge}${deadlineBadge}${costBadge}
            <span class="tag task-date">${t.created}</span>
          </div>
          ${t.notes ? `<div class="task-notes">📝 ${escHtml(t.notes)}</div>` : ''}
        </div>
        <button class="btn-delete" onclick="deleteTask(${t.id})" title="מחק משימה">🗑</button>
      </div>`;
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  let toastTimer;
  function toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2400);
  }

  // Allow Enter in title field to submit
  document.getElementById('taskTitle').addEventListener('keydown', e => {
    if (e.key === 'Enter') addTask();
  });

  render();
</script>
</body>
</html>
